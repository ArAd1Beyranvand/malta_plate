name: malta_plate
description: "Malta's licence plates for the plate_core library — seven plates (private, bus, taxi, personalised, trailer, motorcycle, vintage), black on white with the EU band, themes, a Latin alphabet and an advisory validator."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.11.5
  plate_alphabet: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
